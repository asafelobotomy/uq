<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- uq-settings-helper: only root may own the name; anyone may call it, and each method
     checks its own polkit action before it writes anything. -->
<busconfig>
  <policy user="root">
    <allow own="org.uq.SettingsHelper1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.uq.SettingsHelper1"
           send_interface="org.uq.SettingsHelper1"/>
    <allow send_destination="org.uq.SettingsHelper1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.uq.SettingsHelper1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
