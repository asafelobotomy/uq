# uQ's system directories (tmpfiles.d(5)).
# The greeter's wallpaper, written by uq-settings-helper (root) and read by the greeter.
d /var/lib/uq-greeter 0755 root root -
# The greeter's own state (last user and session). The greeter user comes with greetd.
d /var/cache/uq-greeter 0700 greeter greeter -
