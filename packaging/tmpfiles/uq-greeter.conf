# uq-greeter's directories. The wallpaper the login screen shows (written by uq-settings-helper,
# readable by the greeter), and the greeter's own state (last user and sessions, failure count),
# private to the `greeter` user (created by the greetd package).
d /var/lib/uq-greeter 0755 root root -
d /var/cache/uq-greeter 0700 greeter greeter -
