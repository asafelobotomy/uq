# Installed as /usr/lib/systemd/user/<unit>.d/uq-not-for-greeter.conf for PipeWire, WirePlumber
# and the desktop portals. The login screen runs as the `greeter` user, whose home is `/`, and it
# needs none of them: Qt's portal registration D-Bus-activated xdg-desktop-portal, which pulled in
# the GTK and Hyprland portals and PipeWire, and those then logged permission errors (WirePlumber
# can't write /.local/state) and a failed portal unit at every login. Every other user is
# unaffected.
[Unit]
ConditionUser=!greeter
