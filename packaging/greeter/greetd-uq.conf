# /usr/lib/systemd/system/greetd.service.d/uq.conf: run greetd with uQ's config while
# /etc/uq/greetd.toml exists, and with its stock /etc/greetd/config.toml otherwise, so deleting
# uQ's file (or removing uQ) never leaves the machine without a login screen. A unit-wide
# ConditionPathExists= would stop greetd altogether in that case, so the check is in ExecStart.
[Service]
ExecStart=
ExecStart=/bin/sh -c 'if [ -e /etc/uq/greetd.toml ]; then exec /usr/bin/greetd --config /etc/uq/greetd.toml; fi; exec /usr/bin/greetd'
