[workspace]
resolver = "3"
members = ["crates/uq-core", "crates/uqd", "crates/uqctl", "crates/uqlip", "crates/uq-settings-helper", "apps/uq-settings"]
# A standalone example for other apps' repositories; never built with uQ.
exclude = ["templates/provider"]

[workspace.package]
edition = "2024"
version = "0.3.13"
license = "MIT"
repository = "https://github.com/asafelobotomy/uq"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
thiserror = "2"
tracing = "0.1"
tempfile = "3"
regex = "1"
regex-syntax = "0.8"
minijinja = { version = "3", features = ["json", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "time", "sync", "fs", "signal"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
uq-core = { path = "crates/uq-core" }
