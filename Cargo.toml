[workspace]
resolver = "3"
members = ["crates/uq-core", "crates/uqd", "crates/uqctl", "apps/uq-settings"]

[workspace.package]
edition = "2024"
version = "0.2.0"
license = "MIT"
repository = "https://github.com/asafelobotomy/uq"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
tracing = "0.1"
tempfile = "3"
minijinja = { version = "2", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "time", "sync", "fs", "signal"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
uq-core = { path = "crates/uq-core" }
