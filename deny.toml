# cargo-deny: dependency advisories (CI runs `cargo deny check advisories`).
[advisories]
ignore = [
    # chrono and chrono-tz were marked unmaintained on 2026-11-17 ("no safe upgrade"). They are
    # notices, not vulnerabilities. Moving to jiff or time touches sunrise (sun times), uq-core's
    # schedules and uqctl, so it is its own change; revisit then.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained notice; migrate to jiff/time in its own change" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained notice; migrate to jiff/time in its own change" },
]
