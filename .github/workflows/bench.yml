name: Benchmarks

# The real shell and uqd on a headless Hyprland (bench/live.py): startup, idle memory, CPU,
# wakeups and spawns, popup latency, frame times. A pull request is measured against its base on the
# same machine, in alternating rounds, and fails past the limits in bench/thresholds.json. A push to
# main records its numbers as an artifact. See bench/README.md.
on:
  pull_request:
    paths:
      - 'shell/**'
      - 'crates/**'
      - 'Cargo.*'
      - 'bench/**'
      - '.github/workflows/bench.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          persist-credentials: false
      - name: Check out the base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Load vkms
        run: |
          sudo modprobe vkms 2>/dev/null || {
            sudo apt-get update -q && sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" && sudo modprobe vkms
          }
          card=""
          for c in /sys/class/drm/card*; do
            case "${c##*/}" in *-*) continue ;; esac
            [ "$(basename "$(readlink -f "$c/device")")" = vkms ] && card=/dev/dri/${c##*/}
          done
          [ -n "$card" ] || { echo "::error::vkms loaded but no vkms card found"; exit 1; }
          echo "SMOKE_CARD=$card" >> "$GITHUB_ENV"
      - name: Measure
        run: |
          srcs=/work/head; [ -d base ] && srcs="/work/base /work/head"
          docker run --rm --device "$SMOKE_CARD" -e SMOKE_CARD -e SMOKE_UID="$(id -u)" \
            -v "$GITHUB_WORKSPACE:/work" archlinux:latest bash /work/head/bench/in-container.sh /work/out $srcs
      - name: Compare with the base
        if: github.event_name == 'pull_request'
        run: |
          python3 head/bench/compare.py --base out/base-*.json --head out/head-*.json \
            --rules head/bench/thresholds.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Show the numbers
        if: github.event_name != 'pull_request'
        run: |
          {
            echo '### Benchmarks'; echo
            python3 - out/head-1.json <<'PY'
          import json, sys
          for k, v in json.load(open(sys.argv[1]))["metrics"].items():
              print(f"- `{k}`: {v['value']} {v['unit']}")
          PY
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-results
          path: out/
          if-no-files-found: ignore
