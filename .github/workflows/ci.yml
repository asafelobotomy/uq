name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain, dbus, lua and Hyprland
        run: pacman -Syu --noconfirm --needed rust dbus lua hyprland git
      - uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests (including Hyprland --verify-config for every theme)
        run: cargo test --workspace --locked -- --include-ignored
