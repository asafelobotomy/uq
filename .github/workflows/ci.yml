name: CI

on:
  # Branches only: a v* tag runs this through release.yml instead (workflow_call), not twice.
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain, dbus, lua, Hyprland and Quickshell
        run: pacman -Syu --noconfirm --needed rust dbus lua hyprland git quickshell qt6-declarative jq ttf-dejavu libnotify kirigami qqc2-desktop-style kvantum
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Check Arch's Hyprland is inside the pinned series
        run: |
          v=$(pacman -Q hyprland | awk '{print $2}')
          case "$v" in
            0.56.*|0.57.*) echo "Hyprland $v matches uq-hyprland-pin (0.56.2–0.57.x)" ;;
            *) echo "::error::Arch ships Hyprland $v, outside uq-hyprland-pin (0.56.2–0.57.x). Bump the pin and re-check base.lua."; exit 1 ;;
          esac
      # Hyprland refuses to run as root and needs XDG_RUNTIME_DIR, even for --verify-config.
      - name: Create an unprivileged test user
        run: useradd -m tester && chown -R tester:tester "$GITHUB_WORKSPACE"
      - name: Format, lint and test (including Hyprland --verify-config for every theme)
        run: |
          su tester -c "set -e
            cd '$GITHUB_WORKSPACE'
            export XDG_RUNTIME_DIR=\$(mktemp -d)
            cargo fmt --all --check
            cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
            cargo test --workspace --locked -- --include-ignored"
      - name: Shell lint, shell tests and QML tests
        run: |
          su tester -c "set -e
            cd '$GITHUB_WORKSPACE'
            export XDG_RUNTIME_DIR=\$(mktemp -d)
            scripts/lint-shell.sh
            scripts/lint-settings.sh
            for t in tests/shell/*.sh; do echo \"== \$t\"; bash \"\$t\"; done
            QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -import shell -input tests/qml"

  smoke:
    # The shell on a real Hyprland (scripts/smoke-shell.sh). Hyprland cannot start without a DRM
    # device, even with only headless outputs, and a job container is created before any step
    # could load a module. So this job runs on the runner VM itself: it loads vkms (a virtual KMS
    # card, rendered in software) and runs the test in an Arch container given only that card.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Load vkms
        run: |
          # vkms is in linux-modules on newer Azure kernels, linux-modules-extra on older ones.
          sudo modprobe vkms 2>/dev/null || {
            sudo apt-get update -q && sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" && sudo modprobe vkms
          }
          card=""
          for c in /sys/class/drm/card*; do
            case "${c##*/}" in *-*) continue ;; esac   # connectors (card0-Virtual-1), not cards
            [ "$(basename "$(readlink -f "$c/device")")" = vkms ] && card=/dev/dri/${c##*/}
          done
          [ -n "$card" ] || { echo "::error::vkms loaded but no vkms card found"; ls -l /sys/class/drm; exit 1; }
          echo "vkms card: $card"
          echo "SMOKE_CARD=$card" >> "$GITHUB_ENV"
      # vkms gives Hyprland a card, so the shell must run here: a skip (exit 77) would hide a
      # regression, and fails the job like any other error.
      - name: Shell smoke test on Hyprland
        run: |
          docker run --rm --device "$SMOKE_CARD" -e SMOKE_CARD -e SMOKE_UID="$(id -u)" \
            -v "$GITHUB_WORKSPACE:/src" archlinux:latest bash /src/scripts/smoke-in-container.sh
