name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain, dbus, lua and Hyprland
        run: pacman -Syu --noconfirm --needed rust dbus lua hyprland git
      - uses: actions/checkout@v4
      - name: Check Arch's Hyprland is inside the pinned series
        run: |
          v=$(pacman -Q hyprland | awk '{print $2}')
          case "$v" in
            0.56.*) echo "Hyprland $v matches uq-hyprland-pin (0.56.x)" ;;
            *) echo "::error::Arch ships Hyprland $v, outside uq-hyprland-pin (0.56.x). Bump the pin and re-check base.lua."; exit 1 ;;
          esac
      # Hyprland refuses to run as root and needs XDG_RUNTIME_DIR, even for --verify-config.
      - name: Create an unprivileged test user
        run: useradd -m tester && chown -R tester: "$GITHUB_WORKSPACE"
      - name: Format, lint and test (including Hyprland --verify-config for every theme)
        run: |
          su tester -c "set -e
            cd '$GITHUB_WORKSPACE'
            export XDG_RUNTIME_DIR=\$(mktemp -d)
            cargo fmt --all --check
            cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
            cargo test --workspace --locked -- --include-ignored"
