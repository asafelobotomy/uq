name: CI

on:
  # Branches only: a v* tag runs this through release.yml instead (workflow_call), not twice.
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deny:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    container: archlinux:latest
    steps:
      - name: Install toolchain, dbus, lua, Hyprland and Quickshell
        run: pacman -Syu --noconfirm --needed rust dbus lua hyprland git quickshell qt6-declarative jq ttf-dejavu libnotify kirigami qqc2-desktop-style kvantum nodejs sway wl-clipboard grim
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Arch's Hyprland is inside the pinned series
        run: |
          v=$(pacman -Q hyprland | awk '{print $2}')
          case "$v" in
            0.56.*|0.57.*) echo "Hyprland $v matches uq-hyprland-pin (0.56.2–0.57.x)" ;;
            *) echo "::error::Arch ships Hyprland $v, outside uq-hyprland-pin (0.56.2–0.57.x). Bump the pin and re-check base.lua."; exit 1 ;;
          esac
      # Hyprland refuses to run as root and needs XDG_RUNTIME_DIR, even for --verify-config.
      - name: Create an unprivileged test user
        run: useradd -m tester && chown -R tester:tester "$GITHUB_WORKSPACE"
      # No source file over 400 lines of code (native/uq-loc). It counts the files git tracks;
      # uq/loc-ignore lists the data files it skips.
      - name: File length (at most 400 lines of code per file)
        run: su tester -c "cd '$GITHUB_WORKSPACE' && native/uq-loc/check-loc.sh"
      - name: Format, lint and test (including Hyprland --verify-config for every theme)
        run: |
          su tester -c "set -e
            cd '$GITHUB_WORKSPACE'
            export XDG_RUNTIME_DIR=\$(mktemp -d)
            cargo fmt --all --check
            cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
            cargo test --workspace --locked -- --include-ignored"
      - name: Shell lint, shell tests and QML tests
        run: |
          su tester -c "set -e
            cd '$GITHUB_WORKSPACE'
            export XDG_RUNTIME_DIR=\$(mktemp -d)
            # tests/shell/settings_pages_load.sh opens every Settings page with this build.
            cargo build --locked -p uq-settings
            scripts/lint-shell.sh
            scripts/lint-settings.sh
            for t in tests/shell/*.sh; do echo \"== \$t\"; bash \"\$t\"; done
            QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -import shell -input tests/qml
            QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -import apps/uq-settings/qml -input tests/settings-qml
            node --test 'web/uq-tokens/test/*.test.js' 'tests/pages/*.test.js'"

  native-uq-theme:
    # native/uq-theme: the theme-follow files the Qt and Rust apps vendor. Their tests (parsing,
    # and following a replaced file and a swapped theme/ folder), and check-uq-theme.sh's
    # checksums matching the files.
    runs-on: ubuntu-latest
    timeout-minutes: 80
    container: archlinux:latest
    steps:
      - name: Install Rust, Qt and CMake
        run: pacman -Syu --noconfirm --needed rust qt6-base cmake gcc make git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust module
        run: |
          cargo test --manifest-path native/uq-theme/test/Cargo.toml --locked
          cargo clippy --manifest-path native/uq-theme/test/Cargo.toml --locked --all-targets -- -D warnings
          rustfmt --check --edition 2024 native/uq-theme/uq_theme.rs
      - name: C++ module
        run: |
          cmake -S native/uq-theme/test -B /tmp/uqtheme-build
          cmake --build /tmp/uqtheme-build
          QT_QPA_PLATFORM=offscreen ctest --test-dir /tmp/uqtheme-build --output-on-failure
      - name: check-uq-theme.sh is up to date
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          native/uq-theme/gen-check.sh
          git diff --exit-code -- native/uq-theme
          native/uq-theme/check-uq-theme.sh "$(head -n1 native/uq-theme/uq_theme.rs | grep -oE '[0-9.]+$')" native/uq-theme/uq_theme.rs native/uq-theme/uqtheme.h native/uq-theme/uqtheme.cpp

  native-uq-diag:
    # native/uq-diag: the log format and crash records the Qt and Rust apps vendor (uq-core and
    # uqlip use the Rust file in place). Their tests (a real crash's record included), and
    # check-uq-diag.sh's checksums matching the files.
    runs-on: ubuntu-latest
    timeout-minutes: 80
    container: archlinux:latest
    steps:
      - name: Install Rust, Qt and CMake
        run: pacman -Syu --noconfirm --needed rust qt6-base cmake gcc make git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust module
        run: |
          cargo test --manifest-path native/uq-diag/test/Cargo.toml --locked
          cargo clippy --manifest-path native/uq-diag/test/Cargo.toml --locked --all-targets -- -D warnings
          rustfmt --check --edition 2024 native/uq-diag/uq_diag.rs
      - name: C++ module
        run: |
          cmake -S native/uq-diag/test -B /tmp/uqdiag-build
          cmake --build /tmp/uqdiag-build
          QT_QPA_PLATFORM=offscreen ctest --test-dir /tmp/uqdiag-build --output-on-failure
      - name: check-uq-diag.sh is up to date
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          native/uq-diag/gen-check.sh
          git diff --exit-code -- native/uq-diag
          native/uq-diag/check-uq-diag.sh "$(head -n1 native/uq-diag/uq_diag.rs | grep -oE '[0-9.]+$')" native/uq-diag/uq_diag.rs native/uq-diag/uqdiag.h native/uq-diag/uqdiag.cpp

  native-uq-consts:
    # native/uq-consts: the shared values the apps vendor, generated from consts.toml for Rust, C++,
    # QML, Python, JS and shell. The outputs are up to date, each language's tests pass, and
    # check-uq-native.sh (every kit's checksums) is current and works. uq-core's
    # tests/native_consts.rs holds uQ's own code to the same file.
    runs-on: ubuntu-latest
    timeout-minutes: 80
    container: archlinux:latest
    steps:
      - name: Install Rust, Qt, Python, Node and CMake
        run: pacman -Syu --noconfirm --needed rust qt6-base qt6-declarative cmake gcc make git python nodejs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generated files are up to date
        run: python3 native/uq-consts/gen.py --check
      - name: Rust
        run: |
          cargo test --manifest-path native/uq-consts/test/Cargo.toml --locked
          cargo clippy --manifest-path native/uq-consts/test/Cargo.toml --locked --all-targets -- -D warnings
      - name: Python, JS and shell
        run: |
          python3 -m unittest discover -s native/uq-consts/test -v
          python3 -m unittest discover -s native/uq-theme/test -v
      - name: C++ and QML
        run: |
          cmake -S native/uq-consts/test -B /tmp/uqconsts-build
          cmake --build /tmp/uqconsts-build
          QT_QPA_PLATFORM=offscreen ctest --test-dir /tmp/uqconsts-build --output-on-failure
      - name: check-uq-native.sh is up to date and works
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          native/gen-check.sh
          git diff --exit-code -- native web/uq-tokens
          native/test/check-uq-native.test.sh
          native/test/check-loc.test.sh

  smoke:
    # The shell on a real Hyprland (scripts/smoke-shell.sh). Hyprland cannot start without a DRM
    # device, even with only headless outputs, and a job container is created before any step
    # could load a module. So this job runs on the runner VM itself: it loads vkms (a virtual KMS
    # card, rendered in software) and runs the test in an Arch container given only that card.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load vkms
        run: |
          # vkms is in linux-modules on newer Azure kernels, linux-modules-extra on older ones.
          sudo modprobe vkms 2>/dev/null || {
            sudo apt-get update -q && sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" && sudo modprobe vkms
          }
          card=""
          for c in /sys/class/drm/card*; do
            case "${c##*/}" in *-*) continue ;; esac   # connectors (card0-Virtual-1), not cards
            [ "$(basename "$(readlink -f "$c/device")")" = vkms ] && card=/dev/dri/${c##*/}
          done
          [ -n "$card" ] || { echo "::error::vkms loaded but no vkms card found"; ls -l /sys/class/drm; exit 1; }
          echo "vkms card: $card"
          echo "SMOKE_CARD=$card" >> "$GITHUB_ENV"
      # vkms gives Hyprland a card, so the shell must run here: a skip (exit 77) would hide a
      # regression, and fails the job like any other error.
      - name: Shell smoke test on Hyprland
        run: |
          docker run --rm --device "$SMOKE_CARD" -e SMOKE_CARD -e SMOKE_UID="$(id -u)" \
            -v "$GITHUB_WORKSPACE:/src" archlinux:latest bash /src/scripts/smoke-in-container.sh
      - name: Keep the screenshots and GIFs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-captures
          path: captures/
          if-no-files-found: ignore

  numlock:
    # Num Lock across keyboards (scripts/numlock-live.sh): real uinput keyboards on a real Hyprland
    # (vkms like the smoke job). The container shares the runner's /dev/input, /run/udev and network
    # so libinput sees devices the runner's udev has tagged.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load vkms and uinput
        run: |
          sudo modprobe uinput
          sudo modprobe vkms 2>/dev/null || {
            sudo apt-get update -q && sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" && sudo modprobe vkms
          }
          card=""
          for c in /sys/class/drm/card*; do
            case "${c##*/}" in *-*) continue ;; esac
            [ "$(basename "$(readlink -f "$c/device")")" = vkms ] && card=/dev/dri/${c##*/}
          done
          [ -n "$card" ] || { echo "::error::vkms loaded but no vkms card found"; exit 1; }
          echo "SMOKE_CARD=$card" >> "$GITHUB_ENV"
      - name: Num Lock on Hyprland with real keyboards
        run: |
          # Only the vkms card (Hyprland aborts with the runner's other GPU in view), uinput, and the
          # input event nodes (char major 13), which uinput creates after the container starts.
          docker run --rm --network host --device "$SMOKE_CARD" --device /dev/uinput \
            --device-cgroup-rule 'c 13:* rmw' -v /dev/input:/dev/input -v /run/udev:/run/udev:ro \
            -e SMOKE_CARD -v "$GITHUB_WORKSPACE:/src" archlinux:latest bash /src/scripts/numlock-in-container.sh

  windows:
    # Window handling end to end with timings (scripts/windows-live.sh: open, Half, the resize grip,
    # tab moves and drops, Super+drag, minimise and restore, float, fullscreen, workspaces, close)
    # and look=see>do_'s docked terminal, on the real shell and Hyprland, on vkms like the smoke job.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load vkms
        run: |
          sudo modprobe vkms 2>/dev/null || {
            sudo apt-get update -q && sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" && sudo modprobe vkms
          }
          card=""
          for c in /sys/class/drm/card*; do
            case "${c##*/}" in *-*) continue ;; esac
            [ "$(basename "$(readlink -f "$c/device")")" = vkms ] && card=/dev/dri/${c##*/}
          done
          [ -n "$card" ] || { echo "::error::vkms loaded but no vkms card found"; exit 1; }
          echo "SMOKE_CARD=$card" >> "$GITHUB_ENV"
      - name: Window handling on Hyprland
        run: |
          docker run --rm --device "$SMOKE_CARD" -e SMOKE_CARD -e SMOKE_UID="$(id -u)" -e SMOKE_ONLY="windows-live" \
            -v "$GITHUB_WORKSPACE:/src" archlinux:latest bash /src/scripts/smoke-in-container.sh
      - name: Timings
        if: always()
        run: '[ -f captures/windows-perf.md ] && { echo "### Window handling"; echo; cat captures/windows-perf.md; } >> "$GITHUB_STEP_SUMMARY" || true'
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-captures
          path: captures/
          if-no-files-found: ignore

  settings-live:
    # The Settings live checks (tests/live: slices A–G, keybinds and E) against this checkout's uqd
    # and a headless Hyprland on the uQ config, on vkms like the smoke job. The checks that need a person, a login or real
    # hardware run in the test VM (tests/vm) or on the real desktop (docs/notes).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load vkms
        run: |
          sudo modprobe vkms 2>/dev/null || {
            sudo apt-get update -q && sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" && sudo modprobe vkms
          }
          card=""
          for c in /sys/class/drm/card*; do
            case "${c##*/}" in *-*) continue ;; esac
            [ "$(basename "$(readlink -f "$c/device")")" = vkms ] && card=/dev/dri/${c##*/}
          done
          [ -n "$card" ] || { echo "::error::vkms loaded but no vkms card found"; exit 1; }
          echo "SMOKE_CARD=$card" >> "$GITHUB_ENV"
      - name: Settings live checks on Hyprland
        run: |
          docker run --rm --device "$SMOKE_CARD" -e SMOKE_CARD -e SMOKE_UID="$(id -u)" \
            -v "$GITHUB_WORKSPACE:/src" archlinux:latest bash /src/tests/live/ci-in-container.sh
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: settings-live
          path: target/uq-live
          if-no-files-found: ignore
