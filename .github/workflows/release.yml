name: Release

# Pushing a v* tag (vX.Y.Z or vX.Y.Z-rc.N, made after scripts/bump-version.sh) runs the full CI,
# builds the source tarball and both packages from it, and publishes a GitHub Release with the
# CHANGELOG section as notes. Nothing is pushed to the AUR: the build job prints (and uploads as
# the `aur` artifact) the PKGBUILD and .SRCINFO a maintainer pushes by hand (docs/releasing.md).
#
# Checksums: GitHub's /archive/refs/tags/... tarballs are generated on demand and are not
# guaranteed byte-identical to `git archive` (or to themselves over time). So the AUR PKGBUILD's
# source is the release *asset* uq-<tag>.tar.gz uploaded here, and its sha256sums entry is the
# checksum of exactly that file.

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Install build tools
        # git before checkout, so actions/checkout makes a real repository for git archive.
        run: pacman -Syu --noconfirm --needed base-devel git rust
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check the tag matches the version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $version (want v$version). Run scripts/bump-version.sh first."
            exit 1
          fi
          pkgver=$(sed -n 's/^pkgver=//p' packaging/uq/PKGBUILD)
          if [ "$pkgver" != "${version/-rc./rc}" ]; then
            echo "::error::packaging/uq/PKGBUILD pkgver $pkgver does not match $version (want ${version/-rc./rc})."
            exit 1
          fi
          # Below 1.0.0, or a release candidate: a pre-release.
          case "$version" in
            0.*|*-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >>"$GITHUB_OUTPUT"

      - name: Create the source tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          # Same layout as scripts/build-local-pkg.sh: top directory uq-<tag without v>/.
          git archive --format=tar.gz --prefix="uq-$VERSION/" -o "dist/uq-$VERSION.tar.gz" HEAD
          (cd dist && sha256sum "uq-$VERSION.tar.gz" >"uq-$VERSION.tar.gz.sha256")
          cat "dist/uq-$VERSION.tar.gz.sha256"

      - name: Install the package dependencies
        # From .SRCINFO, so this list cannot drift from the PKGBUILD. uq-hyprland-pin is built below;
        # cargo is provided by rust, installed above.
        run: |
          mapfile -t deps < <(sed -n -E 's/^\t(make|check)?depends = //p' packaging/uq/.SRCINFO \
            | sed -E 's/[<>=].*//' | grep -vx -e uq-hyprland-pin -e cargo | sort -u)
          pacman -S --noconfirm --needed "${deps[@]}" ttf-dejavu

      # makepkg refuses to run as root.
      - name: Create an unprivileged build user
        run: useradd -m builder && chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build uq-hyprland-pin
        # It only carries dependencies; nothing is built, so its own (hyprland) is not needed yet.
        run: |
          su builder -c "set -e; cd '$GITHUB_WORKSPACE'
            PKGDEST='$GITHUB_WORKSPACE/dist' scripts/build-local-pkg.sh --package uq-hyprland-pin --nodeps --noconfirm"
      - name: Install uq-hyprland-pin (uq depends on it)
        run: pacman -U --noconfirm dist/uq-hyprland-pin-*.pkg.tar.zst

      - name: Build uq from the source tarball (with check())
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          su builder -c "set -e; cd '$GITHUB_WORKSPACE'
            export XDG_RUNTIME_DIR=\$(mktemp -d)
            PKGDEST='$GITHUB_WORKSPACE/dist' scripts/build-local-pkg.sh --tarball 'dist/uq-$VERSION.tar.gz' --noconfirm"
          ls -l dist

      - name: Write the release notes and the AUR update
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sum=$(cut -d' ' -f1 "dist/uq-$VERSION.tar.gz.sha256")
          {
            scripts/changelog-section.sh "$VERSION"
            echo
            echo "### Checksums"
            echo
            echo "- \`uq-$VERSION.tar.gz\` (the AUR source): sha256 \`$sum\`"
          } >notes.md

          # The AUR copies: packaging/ with the asset's checksum filled in, and fresh .SRCINFO.
          mkdir -p aur/uq aur/uq-hyprland-pin
          sed "s|^sha256sums=.*|sha256sums=('$sum')|" packaging/uq/PKGBUILD >aur/uq/PKGBUILD
          cp packaging/uq-hyprland-pin/PKGBUILD aur/uq-hyprland-pin/PKGBUILD
          chown -R builder:builder aur
          su builder -c "set -e
            cd '$GITHUB_WORKSPACE/aur/uq' && makepkg --printsrcinfo >.SRCINFO
            cd '$GITHUB_WORKSPACE/aur/uq-hyprland-pin' && makepkg --printsrcinfo >.SRCINFO"

          {
            echo "## AUR update for $VERSION"
            echo
            echo "Once the release is published, check the asset's checksum matches, then copy these"
            echo "into the \`uq\` and \`uq-hyprland-pin\` AUR repositories (also in the \`aur\` artifact):"
            echo
            for f in aur/uq/PKGBUILD aur/uq/.SRCINFO aur/uq-hyprland-pin/.SRCINFO; do
              echo "### $f"
              echo
              echo '```'
              cat "$f"
              echo '```'
              echo
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          if-no-files-found: error
          path: |
            notes.md
            dist/uq-*.tar.gz
            dist/uq-*.tar.gz.sha256
            dist/*.pkg.tar.zst
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aur
          if-no-files-found: error
          include-hidden-files: true
          path: aur/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          (cd release/dist && sha256sum -c "uq-$VERSION.tar.gz.sha256")
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "uQ $VERSION" --notes-file release/notes.md "${flags[@]}" \
            "release/dist/uq-$VERSION.tar.gz" "release/dist/uq-$VERSION.tar.gz.sha256" \
            release/dist/*.pkg.tar.zst
